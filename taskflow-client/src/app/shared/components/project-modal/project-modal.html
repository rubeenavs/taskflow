<div class="pm-backdrop">
  <div class="pm-content p-4">
    <h3 class="mb-3">{{ project ? 'Edit Project' : 'Create Project' }}</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name" />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <p class="text-danger small mt-1">Name is required.</p>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="4" formControlName="description"></textarea>
      </div>

      @if (errorMessage) {
        <p class="text-danger small">{{ errorMessage }}</p>
      }

      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      </div>
    </form>
  </div>
</div>
